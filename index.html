<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>生字手寫小老師</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* 定義教育部標準楷體風格的 Web Font */
        @font-face {
            font-family: 'StandardKai';
            /* 這是一個由開源社群維護的教育部標準楷體 Web Font 來源 (常用於台灣開發者) */
            /* 如果這個 URL 失效，建議將教育部標準楷體 .ttf 檔進行字體抽稀 (Subset) 後自行託管 */
            src: url('https://cdn.jsdelivr.net/gh/naen-kon/Font-Standard-Kai/Standard-Kai.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        .kai-text {
            /* 優先順序：Windows 標楷體 -> Mac/iOS 楷體 -> 教育部風格 WebFont -> 系統預設 Serif */
            font-family: 
                "標楷體", "DFKai-SB", 
                "Kaiti TC", "BiauKai", 
                "StandardKai", 
                "Apple LiSung", "Noto Serif TC", serif;
            font-weight: 700; /* 生字教學通常需要粗一點點 */
        }

        body {
            font-family: "微軟正黑體", "PingFang TC", "Heiti TC", sans-serif;
            background-color: #eef2f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            color: #2c3e50;
        }

        /* 確保注音與生字字體一致 */
        .zhuyin-text, .word-hint, .correct-char {
            font-family: "StandardKai", "標楷體", "DFKai-SB", "Kaiti TC", serif;
        }

        /* 以下維持你原本的 CSS 設定... */
        h1 { margin-bottom: 15px; font-size: 24px; }
        #quiz-container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        .question-box {
            margin-bottom: 15px;
            text-align: left;
            padding: 0 15px;
            border-left: 5px solid #3498db;
        }
        .info-row { font-size: 24px; margin: 8px 0; }
        .label { font-weight: bold; color: #7f8c8d; margin-right: 8px; font-size: 18px; font-family: sans-serif; }
        .zhuyin-text { color: #e74c3c; font-size: 28px; letter-spacing: 2px; }
        .word-hint { font-size: 34px; }
        .canvas-container {
            position: relative; width: 280px; height: 280px; margin: 10px auto;
            border: 4px solid #2c3e50; border-radius: 8px; background-color: #fff;
        }
        .canvas-container::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(to bottom, transparent 49.5%, #ffd1d1 49.5%, #ffd1d1 50.5%, transparent 50.5%),
                linear-gradient(to right, transparent 49.5%, #ffd1d1 49.5%, #ffd1d1 50.5%, transparent 50.5%),
                linear-gradient(45deg, transparent 49.7%, #f0f0f0 49.7%, #f0f0f0 50.3%, transparent 50.3%),
                linear-gradient(-45deg, transparent 49.7%, #f0f0f0 49.7%, #f0f0f0 50.3%, transparent 50.3%);
            pointer-events: none;
        }
        canvas { position: relative; z-index: 10; cursor: crosshair; touch-action: none; }
        .controls { margin-top: 15px; display: flex; justify-content: center; gap: 10px; }
        button { padding: 10px 18px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; }
        #btn-clear { background-color: #e67e22; }
        #btn-check { background-color: #27ae60; }
        #btn-next { background-color: #3498db; display: none; }
        #answer-area { margin-top: 15px; display: none; padding: 15px; background-color: #fff9db; border: 2px dashed #f1c40f; border-radius: 12px; }
        .answer-flex { display: flex; align-items: center; justify-content: center; gap: 20px; }
        .correct-char { font-size: 100px; color: #c0392b; line-height: 1; }
        .char-details { text-align: left; font-size: 22px; color: #2c3e50; }
        #lesson-display { font-size: 16px; color: #16a085; margin-bottom: 10px; display: block; font-weight: bold; }
        #progress { margin-top: 20px; font-size: 14px; color: #7f8c8d; }
    </style>
</head>
<body>

    <h1>✏️ 生字手寫小老師</h1>

    <div id="quiz-container">
        <div class="question-box">
            <div class="info-row kai-text"><span class="label">注音：</span><span id="zhuyin-display" class="zhuyin-text"></span></div>
            <div class="info-row kai-text"><span class="label">詞語：</span><span id="word-display" class="word-hint"></span></div>
        </div>

        <div class="canvas-container">
            <canvas id="draw-pad" width="280" height="280"></canvas>
        </div>

        <div class="controls">
            <button id="btn-clear">重寫</button>
            <button id="btn-check">確認答案</button>
            <button id="btn-next">下一題</button>
        </div>

        <div id="answer-area">
            <span id="lesson-display"></span>
            <div class="answer-flex">
                <div class="correct-char kai-text" id="correct-char"></div>
                <div class="char-details kai-text">
                    <div>部首：<span id="radical-display"></span></div>
                    <div>筆畫：<span id="strokes-display"></span></div>
                </div>
            </div>
        </div>
        
        <div id="progress"></div>
    </div>

    <script>
        const csvUrl = 'data.csv'; 
        let vocabList = [];
        let currentIndex = 0;
        let randomizedList = [];

        async function fetchVocabData() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                parseCSV(data);
                startQuiz();
            } catch (error) {
                alert('載入資料失敗，請確認 data.csv 是否存在。');
            }
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            vocabList = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const cols = line.split(',');
                if (cols.length >= 6) {
                    vocabList.push({
                        lesson: cols[0],
                        char: cols[1],
                        zhuyin: cols[2],
                        radical: cols[3],
                        strokes: cols[4],
                        word: cols[5]
                    });
                }
            }
        }

        function startQuiz() {
            randomizedList = [...vocabList].sort(() => Math.random() - 0.5);
            loadQuestion();
        }

        function loadQuestion() {
            const item = randomizedList[currentIndex];
            document.getElementById('zhuyin-display').innerText = item.zhuyin;
            document.getElementById('word-display').innerText = item.word.replace(item.char, '〇');
            document.getElementById('correct-char').innerText = item.char;
            document.getElementById('radical-display').innerText = item.radical;
            document.getElementById('strokes-display').innerText = item.strokes;
            document.getElementById('lesson-display').innerText = `【${item.lesson}】`;
            document.getElementById('progress').innerText = `進度：${currentIndex + 1} / ${randomizedList.length}`;
            clearCanvas();
            document.getElementById('answer-area').style.display = 'none';
            document.getElementById('btn-check').style.display = 'inline-block';
            document.getElementById('btn-next').style.display = 'none';
        }

        document.getElementById('btn-check').addEventListener('click', () => {
            document.getElementById('answer-area').style.display = 'block';
            document.getElementById('btn-check').style.display = 'none';
            document.getElementById('btn-next').style.display = 'inline-block';
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            currentIndex++;
            if (currentIndex < randomizedList.length) {
                loadQuestion();
            } else {
                alert("練習完畢！");
                currentIndex = 0;
                randomizedList.sort(() => Math.random() - 0.5);
                loadQuestion();
            }
        } );

        const canvas = document.getElementById('draw-pad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#2c3e50';

        function startDrawing(e) { isDrawing = true; draw(e); }
        function stopDrawing() { isDrawing = false; ctx.beginPath(); }
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            ctx.lineTo(clientX - rect.left, clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(clientX - rect.left, clientY - rect.top);
        }
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.beginPath(); }

        document.getElementById('btn-clear').addEventListener('click', clearCanvas);
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});
        canvas.addEventListener('touchend', stopDrawing);

        fetchVocabData();
    </script>
</body>
</html>
