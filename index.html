<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✏️ 生字手寫小老師</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@700&family=LXGW+WenKai+TC:wght@700&display=swap" rel="stylesheet">
    <!-- 全字庫正楷體（教育部標準楷書）子集，由 tools/build_font_subset.py 產生 -->
    <link rel="preload" href="fonts/tw-kai-subset.woff2" as="font" type="font/woff2" crossorigin>

    <style>
        /* 全字庫正楷體：國家發展委員會提供，政府資料開放授權條款第 1 版／OFL 1.1 */
        @font-face {
            font-family: "TW-Kai Web";
            src: url("fonts/tw-kai-subset.woff2") format("woff2");
            font-weight: 400;
            font-display: swap;
        }

        .kai-text, .zhuyin-text, .word-hint, .correct-char, #correct-char {
            font-family: "TW-Kai Web", "標楷體", "DFKai-SB", "BiauKai", "Kaiti TC", "LXGW WenKai TC", "Noto Serif TC", serif !important;
            font-weight: 700 !important;
        }

        body {
            font-family: "微軟正黑體", "PingFang TC", sans-serif;
            background-color: #eef2f7;
            display: flex; flex-direction: column; align-items: center;
            margin: 0; padding: 20px; color: #2c3e50;
        }

        h1 { margin-bottom: 15px; font-size: 24px; text-align: center; }

        .container-box {
            background: white; padding: 20px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center; max-width: 450px; width: 100%;
        }

        /* 設定畫面 */
        #setup-container h2 { font-size: 20px; color: #34495e; margin-top: 0; }
        .setup-controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .setup-controls button { font-size: 14px; padding: 6px 12px; border-radius: 6px; }
        #btn-select-all { background-color: #f39c12; }
        #btn-deselect-all { background-color: #7f8c8d; }
        
        #scope-checkboxes {
            display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
            max-height: 250px; overflow-y: auto;
            border: 2px solid #ecf0f1; padding: 15px; border-radius: 10px;
            margin-bottom: 15px; background-color: #fafbfc;
        }
        .checkbox-label {
            font-size: 18px; cursor: pointer; display: flex; align-items: center; gap: 10px;
            color: #2c3e50; font-weight: bold; width: 100%;
        }
        .checkbox-label input { width: 22px; height: 22px; cursor: pointer; }
        #btn-start-quiz { background-color: #27ae60; width: 100%; font-size: 18px; padding: 12px; }

        /* 測驗畫面 */
        #quiz-container { display: none; }
        .question-box { margin-bottom: 15px; text-align: left; padding: 0 15px; border-left: 5px solid #3498db; }
        .info-row { font-size: 24px; margin: 8px 0; }
        .label { font-weight: bold; color: #7f8c8d; margin-right: 8px; font-size: 18px; }
        .zhuyin-text { color: #e74c3c; font-size: 28px; letter-spacing: 2px; }
        .word-hint { font-size: 34px; }
        
        .canvas-container {
            position: relative; width: 280px; height: 280px; margin: 10px auto;
            border: 4px solid #2c3e50; border-radius: 8px; background-color: #fff;
        }
        .canvas-container::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(to bottom, transparent 49.5%, #ffd1d1 49.5%, #ffd1d1 50.5%, transparent 50.5%),
                linear-gradient(to right, transparent 49.5%, #ffd1d1 49.5%, #ffd1d1 50.5%, transparent 50.5%),
                linear-gradient(45deg, transparent 49.7%, #f0f0f0 49.7%, #f0f0f0 50.3%, transparent 50.3%),
                linear-gradient(-45deg, transparent 49.7%, #f0f0f0 49.7%, #f0f0f0 50.3%, transparent 50.3%);
            pointer-events: none;
        }
        canvas { position: relative; z-index: 10; cursor: crosshair; touch-action: none; }
        
        .controls { margin-top: 15px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 18px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; }
        #btn-clear { background-color: #e67e22; }
        #btn-check { background-color: #27ae60; }
        #btn-next { background-color: #3498db; display: none; }
        #btn-back { background-color: #95a5a6; }

        #answer-area { margin-top: 15px; display: none; padding: 15px; background-color: #fff9db; border: 2px dashed #f1c40f; border-radius: 12px; }
        .answer-flex { display: flex; align-items: center; justify-content: center; gap: 20px; }
        .correct-char { font-size: 100px; color: #c0392b; line-height: 1; margin: 0;}
        .char-details { text-align: left; font-size: 22px; color: #2c3e50; }
        #lesson-display { font-size: 16px; color: #16a085; margin-bottom: 10px; display: block; font-weight: bold; }
        #progress { margin-top: 20px; font-size: 14px; color: #7f8c8d; }

        /* 繼續上次練習 */
        #resume-box {
            display: none; margin-bottom: 15px; padding: 15px; border-radius: 12px;
            background-color: #eafaf1; border: 2px solid #27ae60; text-align: left;
        }
        #resume-box p { margin: 0 0 6px; font-size: 18px; font-weight: bold; color: #1e8449; }
        #resume-scopes { font-size: 14px; color: #555; margin-bottom: 12px; }
        .resume-buttons { display: flex; gap: 10px; }
        #btn-resume { background-color: #27ae60; flex: 2; font-size: 18px; }
        #btn-discard { background-color: #95a5a6; flex: 1; font-size: 14px; }
    </style>
</head>
<body>

    <h1>✏️ 生字手寫小老師</h1>

    <div id="setup-container" class="container-box">
        <div id="resume-box">
            <p id="resume-text"></p>
            <div id="resume-scopes"></div>
            <div class="resume-buttons">
                <button id="btn-resume">▶ 繼續上次練習</button>
                <button id="btn-discard">重新開始</button>
            </div>
        </div>
        <h2>請勾選考試範圍</h2>
        <div class="setup-controls">
            <button id="btn-select-all">✅ 全部勾選</button>
            <button id="btn-deselect-all">❌ 全部取消</button>
        </div>
        <div id="scope-checkboxes">
            </div>
        <button id="btn-start-quiz">開始練習 🚀</button>
    </div>

    <div id="quiz-container" class="container-box">
        <div class="question-box">
            <div class="info-row kai-text"><span class="label">注音：</span><span id="zhuyin-display" class="zhuyin-text"></span></div>
            <div class="info-row kai-text"><span class="label">詞語：</span><span id="word-display" class="word-hint"></span></div>
        </div>

        <div class="canvas-container">
            <canvas id="draw-pad" width="280" height="280"></canvas>
        </div>

        <div class="controls">
            <button id="btn-back">⬅ 重選範圍</button>
            <button id="btn-clear">重寫</button>
            <button id="btn-check">確認答案</button>
            <button id="btn-next">下一題</button>
        </div>

        <div id="answer-area">
            <span id="lesson-display"></span>
            <div class="answer-flex">
                <div class="correct-char kai-text" id="correct-char"></div>
                <div class="char-details kai-text">
                    <div>部首：<span id="radical-display"></span></div>
                    <div>筆畫：<span id="strokes-display"></span></div>
                </div>
            </div>
        </div>
        
        <div id="progress"></div>
    </div>

    <script>
        const csvUrl = 'data.csv'; 
        let allVocabList = [];       
        let uniqueScopes = [];       
        let currentIndex = 0;
        let randomizedList = [];
        let checkedScopesNow = [];
        let answerShown = false;

        // ===== 進度存檔（存在這台裝置的瀏覽器裡） =====
        const PROGRESS_KEY = 'chiCharTest.progress.v1';
        const SCOPES_KEY = 'chiCharTest.scopes.v1';
        const CANVAS_KEY = 'chiCharTest.canvas.v1';

        function storageGet(key) {
            try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
        }
        function storageSet(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 無痕模式等情況存不了，就略過 */ }
        }
        function storageRemove(key) {
            try { localStorage.removeItem(key); } catch (e) {}
        }

        // 每個生字的識別碼：範圍＋課別＋字（data.csv 調整注音、筆畫也不受影響）
        function itemKey(v) { return `${v.scope}|${v.lesson}|${v.char}`; }

        function saveProgress() {
            storageSet(PROGRESS_KEY, {
                scopes: checkedScopesNow,
                order: randomizedList.map(itemKey),
                index: currentIndex,
                answerShown: answerShown,
                savedAt: Date.now()
            });
        }

        function clearProgress() {
            storageRemove(PROGRESS_KEY);
            storageRemove(CANVAS_KEY);
        }

        // 讀回存檔，並對照目前的 data.csv；被刪掉的字自動略過
        function loadSavedProgress() {
            const saved = storageGet(PROGRESS_KEY);
            if (!saved || !Array.isArray(saved.order)) return null;
            const byKey = new Map(allVocabList.map(v => [itemKey(v), v]));
            let index = Number(saved.index) || 0;
            const list = [];
            saved.order.forEach((k, i) => {
                const v = byKey.get(k);
                if (v) list.push(v);
                else if (i < saved.index) index--;   // 前面有字被刪掉，位置往前移
            });
            if (list.length === 0) return null;
            index = Math.min(Math.max(index, 0), list.length - 1);
            return { list, index, scopes: saved.scopes || [], answerShown: !!saved.answerShown && index === saved.index };
        }

        function showResumeBox() {
            const box = document.getElementById('resume-box');
            const saved = loadSavedProgress();
            if (!saved) { box.style.display = 'none'; return; }
            document.getElementById('resume-text').innerText = `上次練習到第 ${saved.index + 1} / ${saved.list.length} 題`;
            document.getElementById('resume-scopes').innerText = '範圍：' + saved.scopes.join('、');
            box.style.display = 'block';
        }

        async function fetchVocabData() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                parseCSV(data);
                buildSetupUI();
                showResumeBox();
            } catch (error) {
                alert('載入資料失敗，請確認 data.csv 是否存在。');
            }
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            allVocabList = [];
            const scopeSet = new Set();

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const cols = line.split(',');
                if (cols.length >= 7) {
                    const scope = cols[0].trim();
                    scopeSet.add(scope);

                    allVocabList.push({
                        scope: scope,
                        lesson: cols[1].trim(),
                        char: cols[2].trim(),
                        zhuyin: cols[3].trim(),
                        radical: cols[4].trim(),
                        strokes: cols[5].trim(),
                        word: cols[6].trim()
                    });
                }
            }
            uniqueScopes = Array.from(scopeSet);
        }

        function buildSetupUI() {
            const container = document.getElementById('scope-checkboxes');
            container.innerHTML = '';
            // 記住上次勾選的範圍；沒有紀錄就全部勾選
            const savedScopes = storageGet(SCOPES_KEY);
            const remembered = Array.isArray(savedScopes) && savedScopes.some(s => uniqueScopes.includes(s));

            uniqueScopes.forEach(scope => {
                const label = document.createElement('label');
                label.className = 'checkbox-label';

                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = scope;
                cb.checked = remembered ? savedScopes.includes(scope) : true;

                label.appendChild(cb);
                label.appendChild(document.createTextNode(scope));
                container.appendChild(label);
            });
        }

        function saveCheckedScopes() {
            storageSet(SCOPES_KEY, Array.from(document.querySelectorAll('#scope-checkboxes input:checked')).map(cb => cb.value));
        }
        document.getElementById('scope-checkboxes').addEventListener('change', saveCheckedScopes);

        document.getElementById('btn-select-all').addEventListener('click', () => {
            document.querySelectorAll('#scope-checkboxes input').forEach(cb => cb.checked = true);
            saveCheckedScopes();
        });

        document.getElementById('btn-deselect-all').addEventListener('click', () => {
            document.querySelectorAll('#scope-checkboxes input').forEach(cb => cb.checked = false);
            saveCheckedScopes();
        });

        function showQuiz() {
            document.getElementById('setup-container').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
        }

        document.getElementById('btn-start-quiz').addEventListener('click', () => {
            const checkedScopes = Array.from(document.querySelectorAll('#scope-checkboxes input:checked')).map(cb => cb.value);

            if (checkedScopes.length === 0) {
                alert('請至少勾選一個考試範圍！');
                return;
            }

            // 根據勾選的「考試範圍」篩選題目
            checkedScopesNow = checkedScopes;
            randomizedList = shuffle(allVocabList.filter(v => checkedScopes.includes(v.scope)));

            showQuiz();
            storageRemove(CANVAS_KEY);
            currentIndex = 0;
            loadQuestion();
        });

        // 繼續上次練習
        document.getElementById('btn-resume').addEventListener('click', () => {
            const saved = loadSavedProgress();
            if (!saved) { showResumeBox(); return; }
            randomizedList = saved.list;
            currentIndex = saved.index;
            checkedScopesNow = saved.scopes;
            showQuiz();
            loadQuestion({ restore: true });
            if (saved.answerShown) showAnswer();
        });

        document.getElementById('btn-discard').addEventListener('click', () => {
            clearProgress();
            showResumeBox();
        });

        // 回到選範圍畫面：進度保留，可以按「繼續上次練習」回來
        document.getElementById('btn-back').addEventListener('click', () => {
            document.getElementById('setup-container').style.display = 'block';
            document.getElementById('quiz-container').style.display = 'none';
            clearCanvas();
            document.getElementById('answer-area').style.display = 'none';
            showResumeBox();
        });

        // 公平洗牌（Fisher–Yates）
        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function loadQuestion(opts = {}) {
            const item = randomizedList[currentIndex];
            document.getElementById('zhuyin-display').innerText = item.zhuyin;
            document.getElementById('word-display').innerText = item.word.replaceAll(item.char, '〇');
            document.getElementById('correct-char').innerText = item.char;
            document.getElementById('radical-display').innerText = item.radical;
            document.getElementById('strokes-display').innerText = item.strokes;
            // 答案區顯示 範圍 + 課別，讓學生知道出處
            document.getElementById('lesson-display').innerText = `【${item.scope}】${item.lesson}`;
            document.getElementById('progress').innerText = `目前進度：${currentIndex + 1} / ${randomizedList.length}`;

            clearCanvas();
            if (opts.restore) restoreCanvas(itemKey(item));
            else storageRemove(CANVAS_KEY);
            answerShown = false;
            document.getElementById('answer-area').style.display = 'none';
            document.getElementById('btn-check').style.display = 'inline-block';
            document.getElementById('btn-next').style.display = 'none';
            saveProgress();
        }

        function showAnswer() {
            answerShown = true;
            document.getElementById('answer-area').style.display = 'block';
            document.getElementById('btn-check').style.display = 'none';
            document.getElementById('btn-next').style.display = 'inline-block';
            saveProgress();
        }

        document.getElementById('btn-check').addEventListener('click', showAnswer);

        document.getElementById('btn-next').addEventListener('click', () => {
            currentIndex++;
            if (currentIndex < randomizedList.length) {
                loadQuestion();
            } else {
                alert("練習完畢！");
                currentIndex = 0;
                randomizedList = shuffle(randomizedList);
                loadQuestion();
            }
        });

        const canvas = document.getElementById('draw-pad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#2c3e50';

        function startDrawing(e) { isDrawing = true; draw(e); }
        function stopDrawing() {
            if (isDrawing) saveCanvas();
            isDrawing = false;
            ctx.beginPath();
        }

        // 寫到一半的筆跡也存起來，重新整理後可以接著寫
        function saveCanvas() {
            const item = randomizedList[currentIndex];
            if (!item) return;
            storageSet(CANVAS_KEY, { key: itemKey(item), image: canvas.toDataURL('image/png') });
        }
        function restoreCanvas(key) {
            const saved = storageGet(CANVAS_KEY);
            if (!saved || saved.key !== key || !saved.image) return;
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0);
            img.src = saved.image;
        }
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            ctx.lineTo(clientX - rect.left, clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(clientX - rect.left, clientY - rect.top);
        }
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.beginPath(); }

        document.getElementById('btn-clear').addEventListener('click', () => {
            clearCanvas();
            storageRemove(CANVAS_KEY);
        });
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});
        canvas.addEventListener('touchend', stopDrawing);

        fetchVocabData();
    </script>
</body>
</html>
