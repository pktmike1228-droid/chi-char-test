<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>生字手寫測驗系統 (GitHub 同步版)</title>
    <style>
        /* 全域設定標楷體 */
        body {
            font-family: "標楷體", "DFKai-SB", "BiauKai", "微軟正黑體", sans-serif;
            background-color: #eef2f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            color: #2c3e50;
        }

        h1 { margin-bottom: 15px; font-size: 28px; }

        #quiz-container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        /* 載入中狀態 */
        #loading-msg { font-size: 20px; color: #7f8c8d; margin-top: 50px; }

        .question-box {
            margin-bottom: 15px;
            text-align: left;
            padding: 0 15px;
            border-left: 5px solid #3498db;
        }

        .info-row {
            font-size: 26px;
            margin: 10px 0;
            font-family: "標楷體", "DFKai-SB", "BiauKai", serif;
        }

        .label {
            font-weight: bold;
            color: #7f8c8d;
            margin-right: 8px;
            font-family: "微軟正黑體", sans-serif;
            font-size: 20px;
        }

        .zhuyin-text {
            color: #e74c3c;
            font-size: 32px;
            letter-spacing: 3px;
        }

        .word-hint {
            font-size: 38px;
            font-weight: bold;
        }

        .canvas-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 15px auto;
            border: 4px solid #2c3e50;
            border-radius: 8px;
            background-color: #fff;
        }
        .canvas-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(to bottom, transparent 49.5%, #ffd1d1 49.5%, #ffd1d1 50.5%, transparent 50.5%),
                linear-gradient(to right, transparent 49.5%, #ffd1d1 49.5%, #ffd1d1 50.5%, transparent 50.5%),
                linear-gradient(45deg, transparent 49.7%, #f0f0f0 49.7%, #f0f0f0 50.3%, transparent 50.3%),
                linear-gradient(-45deg, transparent 49.7%, #f0f0f0 49.7%, #f0f0f0 50.3%, transparent 50.3%);
            pointer-events: none;
        }

        canvas { position: relative; z-index: 10; cursor: crosshair; touch-action: none; }

        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        button {
            padding: 12px 20px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            font-family: "微軟正黑體", sans-serif;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }

        #btn-clear { background-color: #e67e22; }
        #btn-check { background-color: #27ae60; width: 140px; }
        #btn-next { background-color: #3498db; display: none; width: 140px; }

        #answer-area {
            margin-top: 20px;
            display: none;
            padding: 15px;
            background-color: #fff9db;
            border: 2px dashed #f1c40f;
            border-radius: 12px;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        #lesson-display {
            font-size: 18px;
            color: #16a085;
            margin-bottom: 8px;
            display: block;
            font-family: "微軟正黑體", sans-serif;
        }

        .correct-char {
            font-family: "標楷體", "DFKai-SB", "BiauKai", serif;
            font-size: 110px;
            font-weight: bold;
            color: #c0392b;
            line-height: 1;
            margin: 5px 0;
        }

        #progress { margin-top: 20px; font-size: 16px; color: #7f8c8d; font-family: sans-serif; }
    </style>
</head>
<body>

    <h1>✏️ 生字手寫小老師</h1>

    <div id="loading-msg">正在載入最新生字表，請稍候...</div>

    <div id="quiz-container" style="display:none;">
        <div class="question-box">
            <div class="info-row"><span class="label">注音：</span><span id="zhuyin-display" class="zhuyin-text"></span></div>
            <div class="info-row"><span class="label">詞語：</span><span id="word-display" class="word-hint"></span></div>
        </div>

        <div class="canvas-container">
            <canvas id="draw-pad" width="300" height="300"></canvas>
        </div>

        <div class="controls">
            <button id="btn-clear">重寫</button>
            <button id="btn-check">確認答案</button>
            <button id="btn-next">下一題</button>
        </div>

        <div id="answer-area">
            <span id="lesson-display"></span>
            正確生字：
            <div class="correct-char" id="correct-char"></div>
        </div>
        
        <div id="progress"></div>
    </div>

    <script>
        // --- 設定區 ---
        // 如果 CSV 檔案與 index.html 放在同一個資料夾，直接寫檔名即可
        const csvUrl = 'data.csv'; 

        let vocabList = [];
        let currentIndex = 0;
        let randomizedList = [];

        // --- 核心功能：讀取 GitHub 上的 CSV ---
        async function fetchVocabData() {
            try {
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error('無法讀取 CSV 檔案');
                
                const data = await response.text();
                parseCSV(data);
                
                // 隱藏載入訊息，顯示測驗區
                document.getElementById('loading-msg').style.display = 'none';
                document.getElementById('quiz-container').style.display = 'block';
                
                startQuiz();
            } catch (error) {
                console.error(error);
                document.getElementById('loading-msg').innerText = '載入失敗，請確認資料夾中是否有 data.csv 檔案。';
            }
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            vocabList = [];
            
            // 從第一行標題列之後開始讀
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                // 處理 CSV 逗點分隔（簡單處理）
                const cols = line.split(',');
                if (cols.length >= 6) {
                    vocabList.push({
                        lesson: cols[0],
                        char: cols[1],
                        zhuyin: cols[2],
                        word: cols[5]
                    });
                }
            }
        }

        function startQuiz() {
            randomizedList = [...vocabList].sort(() => Math.random() - 0.5);
            loadQuestion();
        }

        function loadQuestion() {
            const item = randomizedList[currentIndex];
            document.getElementById('zhuyin-display').innerText = item.zhuyin;
            document.getElementById('word-display').innerText = item.word.replace(item.char, '〇');
            document.getElementById('correct-char').innerText = item.char;
            document.getElementById('lesson-display').innerText = `【${item.lesson}】`;
            document.getElementById('progress').innerText = `目前進度：${currentIndex + 1} / ${randomizedList.length}`;
            
            clearCanvas();
            document.getElementById('answer-area').style.display = 'none';
            document.getElementById('btn-check').style.display = 'inline-block';
            document.getElementById('btn-next').style.display = 'none';
        }

        // --- 按鈕事件 ---
        document.getElementById('btn-check').addEventListener('click', () => {
            document.getElementById('answer-area').style.display = 'block';
            document.getElementById('btn-check').style.display = 'none';
            document.getElementById('btn-next').style.display = 'inline-block';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            currentIndex++;
            if (currentIndex < randomizedList.length) {
                loadQuestion();
            } else {
                alert("太棒了！所有生字都練習完囉！將重新開始隨機出題。");
                currentIndex = 0;
                randomizedList.sort(() => Math.random() - 0.5);
                loadQuestion();
            }
        });

        // --- 手寫畫布功能 (與之前相同) ---
        const canvas = document.getElementById('draw-pad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        ctx.lineWidth = 12;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#2c3e50';

        function startDrawing(e) { isDrawing = true; draw(e); }
        function stopDrawing() { isDrawing = false; ctx.beginPath(); }
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.beginPath(); }

        document.getElementById('btn-clear').addEventListener('click', clearCanvas);
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});
        canvas.addEventListener('touchend', stopDrawing);

        // 啟動資料抓取
        fetchVocabData();

    </script>
</body>
</html>
