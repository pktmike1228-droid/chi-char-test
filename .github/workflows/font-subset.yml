# data.csv 或 index.html 有變動時，自動重新產生全字庫正楷體子集
name: 更新楷體字型子集

on:
  push:
    branches: [main]
    paths:
      - data.csv
      - index.html
      - tools/build_font_subset.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: font-subset
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安裝全字庫正楷體與 fonttools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-cns11643-kai
          pip install --quiet fonttools brotli

      - name: 產生字型子集
        run: python3 tools/build_font_subset.py /usr/share/fonts/truetype/cns11643/TW-Kai-98_1.ttf

      - name: 有變動就 commit
        run: |
          if git diff --quiet -- fonts/; then
            echo "字型子集沒有變動"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts/tw-kai-subset.woff2
          git commit -m "自動更新楷體字型子集"
          git push
